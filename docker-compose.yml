
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: myfirstapi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: MyFirstApiDb
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: myfirstapi-api
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=MyFirstApiDb;User=root;Password=${MYSQL_ROOT_PASSWORD};"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: MyFirstApi
      Jwt__Audience: MyFirstApiClient
    depends_on:
      - mysql

volumes:
  mysql_data:
